name: 生成贡献图贪吃蛇

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KuroNya39
          outputs: |
            dist/github-snake.svg?color_snake=#39c5bb&color_dots=#ebedf0,#c7ece8,#93ddd6,#63cec4,#39c5bb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39c5bb

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
